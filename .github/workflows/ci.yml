name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24] # 22 = 最低要求 (node:sqlite), 24 = 当前 LTS
        exclude:
          # Keep the pricier runners to the current LTS only.
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:coverage

  examples:
    name: Examples build & run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install & build root package
        run: |
          npm ci
          npm run build

      - name: Install example dependencies
        working-directory: examples/basic
        run: npm ci

      - name: Build example
        working-directory: examples/basic
        run: npm run build

      - name: Run example
        working-directory: examples/basic
        run: node dist/index.js

  website:
    name: Website sanity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: JS syntax check
        run: node --check website/app.js

      - name: Static files present
        run: |
          test -f website/index.html
          test -f website/style.css
          test -f website/app.js
